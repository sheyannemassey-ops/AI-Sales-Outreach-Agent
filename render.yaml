services:
  - type: web
    name: signaldesk-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signaldesk-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGINS
        value: https://sheyannemassey-ops.github.io
      - key: SEED_DEMO_DATA
        value: "true"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: signaldesk-postgres
    databaseName: signaldesk
    user: signaldesk
    plan: basic-256mb
    postgresMajorVersion: "16"
